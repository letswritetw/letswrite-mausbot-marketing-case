  var tocObserver = null;
  var tocScrollHandler = null;

  function setTocActive(id) {
    var links = detailEl.querySelectorAll('.toc-link');
    for (var i = 0; i < links.length; i++) {
      if (links[i].getAttribute('data-toc') === id) {
        links[i].setAttribute('aria-current', 'location');
      } else {
        links[i].removeAttribute('aria-current');
      }
    }
  }

  function currentTocTarget(targets) {
    var line = 100;
    var best = null;
    var first = null;
    for (var i = 0; i < targets.length; i++) {
      var top = targets[i].getBoundingClientRect().top;
      if (top <= line) { best = targets[i]; }
      if (top > line && !first) { first = targets[i]; }
    }
    return best || first;
  }

  function initToc() {
    if (tocObserver) {
      tocObserver.disconnect();
      tocObserver = null;
    }
    if (tocScrollHandler) {
      window.removeEventListener('scroll', tocScrollHandler);
      tocScrollHandler = null;
    }
    var links = detailEl.querySelectorAll('.toc-link');
    if (!links.length) { return; }
    var targets = [];
    for (var i = 0; i < links.length; i++) {
      var target = document.getElementById(links[i].getAttribute('data-toc'));
      if (target) { targets.push(target); }
    }
    if (!targets.length) { return; }
    function update() {
      var picked = currentTocTarget(targets);
      if (picked) { setTocActive(picked.id); }
    }
    var ticking = false;
    tocScrollHandler = function () {
      if (ticking) { return; }
      ticking = true;
      window.requestAnimationFrame(function () {
        ticking = false;
        update();
      });
    };
    window.addEventListener('scroll', tocScrollHandler, { passive: true });
    if (typeof IntersectionObserver === 'function') {
      tocObserver = new IntersectionObserver(update, { rootMargin: '0px 0px -60% 0px', threshold: 0 });
      targets.forEach(function (item) { tocObserver.observe(item); });
    }
    update();
  }

  function renderDetail() {
    var backLabel = state.backHash === '#/favorites' ? '回我的收藏' : '回列表';
    var backHtml = document.body.classList.contains('is-detailing')
      ? '<button type="button" class="back" id="backBtn">' + backLabel + '</button>'
      : '';

    function paint(inner) {
      var entering = !!state.current && detailEl.getAttribute('data-rendered') !== state.current;
      detailEl.innerHTML = backHtml + inner;
      detailEl.setAttribute('data-rendered', state.current || '');
      detailEl.classList.remove('is-entering');
      if (entering) {
        void detailEl.offsetWidth;
        detailEl.classList.add('is-entering');
      }
      var backBtn = document.getElementById('backBtn');
      if (backBtn) { backBtn.addEventListener('click', backToList); }
      if (state.focusNote && state.focusNote === state.current) {
        state.focusNote = null;
        var ta = document.getElementById('favNote');
        if (ta) {
          ta.focus();
          try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch (e) {}
        }
      }
      initToc();
    }

    if (!state.current) {
      paint(state.cases.length ? noResultBlock() : emptyBlock());
      return;
    }

    var c = findCase(state.current);
    if (!c) {
      paint(state.cases.length ? noResultBlock() : emptyBlock());
      return;
    }

    var body;
    var sourceHtml = '';
    var toc = [];
    var titleHtml = highlight(displayCaseTitle(c.title), terms());
    var meta = esc(c.date) + (c.theme ? '｜' + esc(c.theme) : '');
    var gloss = { entries: [], seen: Object.create(null), allowed: Object.create(null) };
    var glossaryBlock = '';
    var summary = '';
    if (state.err[c.file]) {
      body = stateBlock('載入失敗，請按重新整理。', '');
    } else if (!hasText(c.file)) {
      body = '<p class="loading">載入中…</p>';
    } else {
      var bodyHtml = mergeFlowParagraphs(renderBody(state.text[c.file]));
      pickGlossTerms([bodyHtml]).forEach(function (g) {
        gloss.allowed[g.term] = true;
      });
      var parts = articleParts(annotateTerms(bodyHtml, gloss));
      body = '<div class="prose">' + parts.html + '</div>';
      sourceHtml = parts.source;
      toc = parts.toc;
      glossaryBlock = glossaryHtml(gloss);
      summary = summaryHtml(state.text[c.file], toc);
    }

    var readerClass = 'reader' +
      (glossaryBlock ? '' : ' no-glossary') +
      (summary ? '' : ' no-summary');

    if (hasText(c.file) && !state.err[c.file]) { recordView(c.file, c); }

    paint(
      '<div class="' + readerClass + '">' +
      '<div class="reader-main">' +
      '<h1>' + titleHtml + '</h1>' +
      '<p class="dateline">' +
      '<span>' + meta + '</span>' +
      '<span class="dateline-stats">' +
      '<span class="stat-views">瀏覽 <span id="statViews">' + countText(c.views) + '</span></span>' +
      '<span class="stat-favs" role="img" aria-label="收藏 ' + countText(c.fav_count) + ' 次">' +
      '<span class="stat-ico" aria-hidden="true"></span>' +
      '<span id="statFavs">' + countText(c.fav_count) + '</span>' +
      '</span>' +
      '</span>' +
      '</p>' +
      body +
      favBoxHtml(c.file) +
      sourceHtml +
      pnNavHtml(c) +
      '</div>' +
      (glossaryBlock
        ? '<aside class="reader-glossary" aria-labelledby="glossaryTitle"><div class="rail-sticky">' + glossaryBlock + '</div></aside>'
        : '') +
      summary +
      '</div>'
    );
  }

  function updateCount(shown) {
    var hasQuery = !!state.query;
    countEl.hidden = !hasQuery;
    clearEl.hidden = !qEl.value;
    qEl.classList.toggle('has-value', !!qEl.value);
    if (hasQuery) { countEl.textContent = shown + ' 篇'; }
  }

  function updateFoot() {
    if (!footCountEl) { return; }
    footCountEl.textContent = state.loaded ? String(state.cases.length) : '—';
  }

  function applyFilter() {
    var shown = visibleCases();
    state.shown = shown.length;
    renderList(shown);
    renderSide();
    renderDetail();
    if (document.body.classList.contains('is-favorites')) {
      updateCount(renderFavorites());
    } else {
      updateCount(shown.length);
    }
  }

  function preloadAll() {
    var todo = state.cases.filter(function (c) { return !hasText(c.file); });
    if (!todo.length) { state.indexing = false; return; }
    state.indexing = true;
    var jobs = todo.map(function (c) {
      return ensureText(c.file).catch(function () { return null; });
    });
    Promise.all(jobs).then(function () {
      state.indexing = false;
      applyFilter();
    });
  }

  function parseRoute() {
    var h = location.hash || '';
    if (h === '#/favorites') { return { detailing: false, favorites: true, file: null }; }
    var m = h.match(/^#\/case\/(.+)$/);
    if (!m) { return { detailing: false, favorites: false, file: null }; }
    var file = m[1];
    try { file = decodeURIComponent(file); } catch (e) {}
    return { detailing: true, favorites: false, file: file };
  }

  function focusBack() {
    if (document.activeElement && document.activeElement.id === 'favNote') { return; }
    var b = document.getElementById('backBtn');
    if (b) { b.focus(); }
  }

  function ensureCurrent(focus) {
    var file = state.current;
    if (!file || hasText(file) || state.err[file]) {
      if (focus) { focusBack(); }
      return;
    }
    if (focus) { focusBack(); }
    ensureText(file).then(function () {
      if (state.current === file) {
        renderDetail();
        if (focus) { focusBack(); }
      }
    }).catch(function () {
      if (state.current === file) {
        renderDetail();
        if (focus) { focusBack(); }
      }
    });
  }

  function renderRoute(restoreScroll) {
    var r = parseRoute();
    if (r.detailing && state.loaded && !findCase(r.file)) {
      location.replace('#/');
      return;
    }
    document.body.classList.toggle('is-detailing', r.detailing);
    document.body.classList.toggle('is-favorites', r.favorites);
    updateTabs(r.favorites);

    if (r.favorites) {
      state.current = null;
      state.listScroll = 0;
      applyFilter();
      if (restoreScroll) { window.scrollTo(0, 0); }
      return;
    }

    if (r.detailing) {
      state.current = r.file;
    } else {
      state.backHash = null;
      if (state.current && !findCase(state.current)) {
        state.current = null;
      }
    }
    applyFilter();
    if (r.detailing) {
      if (restoreScroll) {
        window.scrollTo(0, 0);
        ensureCurrent(true);
      } else {
        ensureCurrent(false);
      }
    } else if (restoreScroll) {
      window.scrollTo(0, state.listScroll);
      if (state.restoreFocus) {        state.restoreFocus = false;
        var card = state.lastFile
          ? listEl.querySelector('.card[data-file="' + state.lastFile + '"]')
          : null;
        if (card) {
          try { card.focus({ preventScroll: true }); } catch (e) { card.focus(); }
        }
      }
    }
  }

  function select(file) {
    state.listScroll = window.scrollY;
    state.lastFile = file;
    state.backHash = null;
    location.hash = '#/case/' + file.split('/').map(encodeURIComponent).join('/');
  }

  function backToList() {
    state.restoreFocus = true;
    location.hash = state.backHash || '#/';
  }

  function toList() {
    if (document.body.classList.contains('is-detailing')) {
      state.listScroll = 0;
      location.hash = '#/';
    }
  }

  function refresh() {
    refreshBtn.disabled = true;
    return api('/api/cases').then(function (d) {
      var next = (d.cases || []).slice();

      state.cases = next;

      // 文章內容可能已被改版，重新整理時一律重抓，避免舊內容被記憶體快取蓋住。
      state.text = {};
      state.err = {};
      state.loaded = true;
      updateFoot();

      if (state.current && !findCase(state.current)) { state.current = null; }

      renderRoute(state.boot);
      state.boot = false;
      preloadAll();
    }).catch(function () {
      listEl.innerHTML = '';
      listEl.removeAttribute('aria-busy');
      listStateEl.innerHTML = stateBlock('載入失敗，請按重新整理。', '');
      listStateEl.hidden = false;
      detailEl.innerHTML = stateBlock('載入失敗，請按重新整理。', '');
    }).then(function () {
      refreshBtn.disabled = false;
    });
  }

  listEl.addEventListener('click', function (e) {
    var favBtn = e.target.closest ? e.target.closest('.card-fav') : null;
    if (favBtn) {
      var favFile = favBtn.getAttribute('data-fav');
      if (!favFile) { return; }
      if (!state.me) {
        openAuth('login', { file: favFile, note: '' });
      } else if (isFav(favFile)) {
        state.focusNote = favFile;
        select(favFile);
      } else {
        saveFavorite(favFile, '');
      }
      return;
    }
    var card = e.target.closest ? e.target.closest('.card') : null;
    if (!card) { return; }
    var file = card.getAttribute('data-file');
    if (file) { select(file); }
  });

  detailEl.addEventListener('click', function (e) {
    var tocLink = e.target.closest ? e.target.closest('[data-toc]') : null;
    if (tocLink) {
      var tocTarget = document.getElementById(tocLink.getAttribute('data-toc'));
      if (tocTarget) {
        var reduceToc = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        try {
          tocTarget.scrollIntoView({ behavior: reduceToc ? 'auto' : 'smooth', block: 'start' });
        } catch (errToc) {
          tocTarget.scrollIntoView();
        }
        setTocActive(tocTarget.id);
        try { tocTarget.focus({ preventScroll: true }); } catch (errFocus) {}
      }
      return;
    }
    var act = e.target.closest ? e.target.closest('[data-fav-act]') : null;
    if (act) {
      var action = act.getAttribute('data-fav-act');
      var current = state.current;
      if (!current) { return; }
      if (action === 'login') {
        openAuth('login', { file: current, note: '' });
        return;
      }
      if (action === 'save') {
        var noteEl = document.getElementById('favNote');
        saveFavorite(current, noteEl ? noteEl.value : '');
        return;
      }
      if (action === 'remove') {
        if (window.confirm('確定取消收藏這篇案例？註記會一起刪除。')) {
          removeFavorite(current);
        }
        return;
      }
    }
    var term = e.target.closest ? e.target.closest('.term') : null;
    if (!term) { return; }
    var item = document.getElementById(term.getAttribute('data-gloss'));
    if (!item) { return; }
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var scroller = item.closest ? item.closest('.rail-sticky') : null;
    if (scroller && scroller.scrollHeight > scroller.clientHeight + 1) {
      var sRect = scroller.getBoundingClientRect();
      var iRect = item.getBoundingClientRect();
      var top = scroller.scrollTop + iRect.top - sRect.top -
        (scroller.clientHeight / 2) + (iRect.height / 2);
      try {
        scroller.scrollTo({ top: Math.max(0, top), behavior: reduce ? 'auto' : 'smooth' });
      } catch (err) {
        scroller.scrollTop = Math.max(0, top);
      }
    } else {
      try {
        item.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });
      } catch (err2) {
        item.scrollIntoView();
      }
    }
    try { item.focus({ preventScroll: true }); } catch (err3) { item.focus(); }
    item.classList.add('is-flash');
    clearTimeout(item._flashTimer);
    item._flashTimer = setTimeout(function () { item.classList.remove('is-flash'); }, 1600);
  });

  favListEl.addEventListener('click', function (e) {
    var link = e.target.closest ? e.target.closest('.fav-item-title') : null;
    if (link) { state.backHash = '#/favorites'; return; }
    var act = e.target.closest ? e.target.closest('[data-fav-act]') : null;
    if (!act) { return; }
    var item = act.closest('.fav-item');
    var file = item ? item.getAttribute('data-file') : null;
    if (!file) { return; }
    var action = act.getAttribute('data-fav-act');
    if (action === 'edit') {
      state.editingFav = file;
      renderFavorites();
    } else if (action === 'cancel') {
      state.editingFav = null;
      renderFavorites();
    } else if (action === 'remove') {
      if (window.confirm('確定取消收藏這篇案例？註記會一起刪除。')) {
        removeFavorite(file);
      }
    }
  });

  favListEl.addEventListener('submit', function (e) {
    var form = e.target.closest ? e.target.closest('.fav-editor') : null;
    if (!form) { return; }
    e.preventDefault();
    var file = form.getAttribute('data-editor');
    var ta = form.querySelector('.fav-input');
    if (file) { saveFavorite(file, ta ? ta.value : ''); }
  });

  favStateEl.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-auth]') : null;
    if (btn) { openAuth(btn.getAttribute('data-auth') || 'login'); }
  });

  if (exportBtn) {
    exportBtn.addEventListener('click', exportFavorites);
  }

  authAreaEl.addEventListener('click', function (e) {
    var notifyBtn = e.target.closest ? e.target.closest('#notifyBtn') : null;
    if (notifyBtn) {
      setNotify(!state.notify.enabled);
      return;
    }
    var btn = e.target.closest ? e.target.closest('#authBtn') : null;
    if (!btn) { return; }
    if (state.me) { logout(); } else { openAuth('login'); }
  });

  if (notifyToggleEl) {
    notifyToggleEl.addEventListener('change', function () {
      setNotify(notifyToggleEl.checked);
    });
  }

  authForm.addEventListener('submit', submitAuth);
  authTabLogin.addEventListener('click', function () { setAuthMode('login'); authEmail.focus(); });
  authTabRegister.addEventListener('click', function () { setAuthMode('register'); authEmail.focus(); });
  document.getElementById('authClose').addEventListener('click', closeAuth);
  authDlg.addEventListener('close', function () { state.pendingFav = null; });

  var timer = null;
  qEl.addEventListener('input', function () {
    clearTimeout(timer);
    clearEl.hidden = !qEl.value;
    qEl.classList.toggle('has-value', !!qEl.value);
    toList();
    timer = setTimeout(function () {
      state.query = qEl.value.trim().toLowerCase();
      applyFilter();
    }, 120);
  });

  clearEl.addEventListener('click', function () {
    qEl.value = '';
    state.query = '';
    toList();
    applyFilter();
    qEl.focus();
  });

  refreshBtn.addEventListener('click', function () {
    refresh();
  });

  document.addEventListener('keydown', function (e) {
    if (authDlg.open) { return; }
    if (e.key === '/' && document.activeElement !== qEl) {
      e.preventDefault();
      qEl.focus();
    } else if (e.key === 'Escape' && document.activeElement === qEl) {
      qEl.value = '';
      state.query = '';
      toList();
      applyFilter();
      qEl.blur();
    }
  });

  setInterval(function () {
    api('/api/cases').then(function (d) {
      var a = state.cases.map(function (c) { return c.file; }).join('|');
      var b = (d.cases || []).map(function (c) { return c.file; }).join('|');
      if (a !== b) { refresh(); }
    }).catch(function () {});
  }, 60000);

  if (!location.hash) { history.replaceState(null, '', '#/'); }
  state.boot = true;
  window.addEventListener('hashchange', function () { renderRoute(true); });
  renderAuth();
  refresh();
  loadMe();
})();
</script>
</body>
</html>
